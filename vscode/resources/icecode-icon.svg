<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1A2E"/>
      <stop offset="100%" style="stop-color:#162D50"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#0099FF"/>
      <stop offset="100%" style="stop-color:#0066CC"/>
    </linearGradient>
    <linearGradient id="iceGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#0099FF"/>
      <stop offset="100%" style="stop-color:#0066CC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="48" ry="48" fill="url(#bgGrad)"/>

  <g transform="translate(128,128)" filter="url(#glow)">
    <g stroke="url(#iceGrad)" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="0" y1="0" x2="0" y2="-70"/>
      <line x1="0" y1="0" x2="60.6" y2="-35"/>
      <line x1="0" y1="0" x2="60.6" y2="35"/>
      <line x1="0" y1="0" x2="0" y2="70"/>
      <line x1="0" y1="0" x2="-60.6" y2="35"/>
      <line x1="0" y1="0" x2="-60.6" y2="-35"/>
    </g>

    <g stroke="url(#iceGrad2)" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="0" y1="-45" x2="22" y2="-57"/>
      <line x1="0" y1="-45" x2="-22" y2="-57"/>
      <line x1="39" y1="-22.5" x2="52" y2="-45"/>
      <line x1="39" y1="-22.5" x2="52" y2="0"/>
      <line x1="39" y1="22.5" x2="52" y2="0"/>
      <line x1="39" y1="22.5" x2="52" y2="45"/>
      <line x1="0" y1="45" x2="22" y2="57"/>
      <line x1="0" y1="45" x2="-22" y2="57"/>
      <line x1="-39" y1="22.5" x2="-52" y2="45"/>
      <line x1="-39" y1="22.5" x2="-52" y2="0"/>
      <line x1="-39" y1="-22.5" x2="-52" y2="0"/>
      <line x1="-39" y1="-22.5" x2="-52" y2="-45"/>
    </g>

    <g stroke="url(#iceGrad)" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="0" y1="-60" x2="12" y2="-66"/>
      <line x1="0" y1="-60" x2="-12" y2="-66"/>
      <line x1="52" y1="-30" x2="60" y2="-45"/>
      <line x1="52" y1="-30" x2="62" y2="-18"/>
      <line x1="52" y1="30" x2="62" y2="18"/>
      <line x1="52" y1="30" x2="60" y2="45"/>
      <line x1="0" y1="60" x2="12" y2="66"/>
      <line x1="0" y1="60" x2="-12" y2="66"/>
      <line x1="-52" y1="30" x2="-60" y2="45"/>
      <line x1="-52" y1="30" x2="-62" y2="18"/>
      <line x1="-52" y1="-30" x2="-62" y2="-18"/>
      <line x1="-52" y1="-30" x2="-60" y2="-45"/>
    </g>

    <polygon points="0,-75 6,-67 0,-70 -6,-67" fill="#00D4FF" opacity="0.9"/>
    <polygon points="65,-37.5 60,-44 63,-37 58,-32" fill="#00D4FF" opacity="0.9"/>
    <polygon points="65,37.5 60,44 63,37 58,32" fill="#00D4FF" opacity="0.9"/>
    <polygon points="0,75 6,67 0,70 -6,67" fill="#00D4FF" opacity="0.9"/>
    <polygon points="-65,37.5 -60,44 -63,37 -58,32" fill="#00D4FF" opacity="0.9"/>
    <polygon points="-65,-37.5 -60,-44 -63,-37 -58,-32" fill="#00D4FF" opacity="0.9"/>

    <polygon points="0,0 12,-6 12,6" fill="#00D4FF" opacity="0.3" transform="rotate(0)"/>
    <polygon points="0,0 12,-6 12,6" fill="#0099FF" opacity="0.3" transform="rotate(60)"/>
    <polygon points="0,0 12,-6 12,6" fill="#00D4FF" opacity="0.3" transform="rotate(120)"/>
    <polygon points="0,0 12,-6 12,6" fill="#0099FF" opacity="0.3" transform="rotate(180)"/>
    <polygon points="0,0 12,-6 12,6" fill="#00D4FF" opacity="0.3" transform="rotate(240)"/>
    <polygon points="0,0 12,-6 12,6" fill="#0099FF" opacity="0.3" transform="rotate(300)"/>

    <circle cx="0" cy="0" r="10" fill="url(#iceGrad)" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#00D4FF" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="white" opacity="0.95"/>
  </g>

  <g opacity="0.15" fill="#00D4FF">
    <circle cx="45" cy="45" r="1.5"/>
    <circle cx="200" cy="50" r="1"/>
    <circle cx="55" cy="200" r="1.5"/>
    <circle cx="195" cy="195" r="1"/>
    <circle cx="35" cy="120" r="1"/>
    <circle cx="210" cy="130" r="1.5"/>
    <circle cx="120" cy="35" r="1"/>
    <circle cx="130" cy="215" r="1"/>
  </g>
</svg>
