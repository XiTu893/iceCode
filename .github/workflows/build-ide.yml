name: Build IDE Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root dependencies
        run: bun install

      - name: Build CLI backend
        run: bun run build

      - name: Download portable Bun (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ide\build\backend
          $url = "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile bun-portable.zip
          Expand-Archive -Path bun-portable.zip -DestinationPath ide\build\backend -Force
          $bunExe = Get-ChildItem -Path ide\build\backend -Recurse -Filter "bun.exe" | Select-Object -First 1
          Copy-Item $bunExe.FullName -Destination ide\build\backend\bun.exe -Force
          Write-Host "Bun executable: $($bunExe.FullName)"
          dir ide\build\backend

      - name: Download portable Bun (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ide/build/backend
          curl -fsSL "https://github.com/oven-sh/bun/releases/latest/download/bun-darwin-aarch64.zip" -o bun-portable.zip
          unzip -o bun-portable.zip -d ide/build/backend/
          cp ide/build/backend/bun-darwin-aarch64/bun ide/build/backend/bun 2>/dev/null || true
          chmod +x ide/build/backend/bun
          ls -la ide/build/backend/

      - name: Download portable Bun (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ide/build/backend
          curl -fsSL "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip" -o bun-portable.zip
          unzip -o bun-portable.zip -d ide/build/backend/
          cp ide/build/backend/bun-linux-x64/bun ide/build/backend/bun 2>/dev/null || true
          chmod +x ide/build/backend/bun
          ls -la ide/build/backend/

      - name: Install IDE dependencies
        run: |
          cd ide
          npm install

      - name: Build Vite frontend
        run: |
          cd ide
          npx vite build

      - name: Build Electron main process
        run: |
          cd ide
          npx tsc --project tsconfig.electron.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cd ide
          npx electron-builder --win zip --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd ide
          npx electron-builder --mac zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd ide
          npx electron-builder --linux zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IceCode-IDE-${{ matrix.platform }}
          path: |
            ide/release/*.zip
            ide/release/*.dmg
            ide/release/*.AppImage
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
          generate_release_notes: true
          body: |
            ## IceCode IDE - Portable Release

            ### Download & Run
            1. Download the ZIP for your platform
            2. Extract to any folder
            3. Double-click `IceCode IDE.exe` (Windows) or run the app binary

            **No Node.js, Bun, or any runtime installation required!**

            The portable ZIP bundles:
            - Electron app (IDE UI + Monaco Editor)
            - Bun runtime (for AI backend)
            - CLI backend (AI Agent with 20+ tools)
            - gRPC server (auto-starts on launch)

            ### Features
            - AI-First IDE layout (Trae-style)
            - Multi-LLM support (Claude/GPT/Gemini/DeepSeek/Ollama)
            - Monaco Editor with Trae Dark theme
            - Integrated terminal
            - Git integration
            - Slash commands & @ file mentions
            - Artifact summary & diff preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
