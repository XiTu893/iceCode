name: Build IceCode IDE (VSCode Fork)

on:
  push:
    tags:
      - 'icecode-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path $vsPath)) {
            $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community"
          }
          if (-not (Test-Path $vsPath)) {
            $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools"
          }
          if (Test-Path $vsPath) {
            Write-Host "Found Visual Studio at: $vsPath"
            $env:vs2022_install = $vsPath
            echo "vs2022_install=$vsPath" >> $env:GITHUB_ENV
          } else {
            Write-Host "Visual Studio not found, installing Build Tools..."
            choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --quiet" --no-progress
          }

      - name: Check npm version
        run: npm --version

      - name: Install VSCode dependencies
        working-directory: vscode
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: '1'
          npm_command: install
          GYP_MSVS_VERSION: '2022'
        run: npm install --no-optional 2>&1 || npm install --ignore-scripts --no-optional

      - name: Install build dependencies
        working-directory: vscode/build
        run: npm install --ignore-scripts

      - name: Compile VSCode
        working-directory: vscode
        run: npm run compile
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Compile Extensions
        working-directory: vscode
        run: npm run gulp compile-extensions
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build IceCode AI Extension
        working-directory: vscode/extensions/icecode-ai
        run: |
          npm install
          npm run compile

      - name: Package Windows
        if: runner.os == 'Windows'
        working-directory: vscode
        run: npm run gulp vscode-win32-x64
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Package Linux
        if: runner.os == 'Linux'
        working-directory: vscode
        run: npm run gulp vscode-linux-x64
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = "vscode/.build/win32-x64"
          if (Test-Path $buildDir) {
            $appDir = Get-ChildItem -Path $buildDir -Directory | Select-Object -First 1
            if ($appDir) {
              Compress-Archive -Path $appDir.FullName -DestinationPath "IceCode-IDE-win-x64.zip"
              Write-Host "Packaged: $($appDir.FullName)"
            } else {
              Write-Host "No app directory found in $buildDir"
              Get-ChildItem -Path $buildDir -Recurse -Depth 1 | Select-Object FullName
            }
          } else {
            Write-Host "Build directory not found: $buildDir"
            Get-ChildItem -Path "vscode/.build" -Recurse -Depth 2 | Select-Object FullName
          }

      - name: Create TAR (Linux)
        if: runner.os == 'Linux'
        run: |
          BUILD_DIR="vscode/.build/linux-x64"
          if [ -d "$BUILD_DIR" ]; then
            APP_DIR=$(find "$BUILD_DIR" -maxdepth 1 -type d | tail -1)
            if [ -n "$APP_DIR" ] && [ "$APP_DIR" != "$BUILD_DIR" ]; then
              cd "$BUILD_DIR"
              tar -czf ../../../IceCode-IDE-linux-x64.tar.gz "$(basename "$APP_DIR")"
              echo "Packaged: $APP_DIR"
            else
              echo "No app directory found in $BUILD_DIR"
              find "$BUILD_DIR" -maxdepth 2 -type d
            fi
          else
            echo "Build directory not found: $BUILD_DIR"
            find vscode/.build -maxdepth 3 -type d 2>/dev/null || echo "No .build directory"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IceCode-IDE-${{ matrix.platform }}
          path: |
            IceCode-IDE-*.zip
            IceCode-IDE-*.tar.gz
          retention-days: 90
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true
          body: |
            ## IceCode IDE - VSCode Fork Release

            ### Download & Run
            1. Download the ZIP/TAR for your platform
            2. Extract to any folder
            3. Run `IceCode IDE` executable

            ### Features
            - Based on VSCode 1.121.0 (full editor capabilities)
            - IceCode AI panel (left sidebar, Trae-style)
            - IceCode Dark theme (default)
            - Open VSX extension marketplace
            - Claude Code backend integration via gRPC
            - Multi-LLM support (Claude/GPT/Gemini/DeepSeek/Ollama)
            - Built-in Git, Terminal, Debug support
            - Full VSCode extension compatibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
