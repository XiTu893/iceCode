name: Build IceCode IDE (VSCode Fork)

on:
  push:
    tags:
      - 'icecode-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VSCODE_QUALITY: insider
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
            arch: x64
            gulp_target: vscode-win32-x64-min
          - os: ubuntu-latest
            platform: linux-x64
            arch: x64
            gulp_target: vscode-linux-x64-min
          - os: macos-latest
            platform: darwin-arm64
            arch: arm64
            gulp_target: vscode-darwin-arm64-min

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'vscode/.nvmrc'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Setup build environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config

      - name: Ensure cgmanifest.json exists
        shell: pwsh
        run: |
          if (-not (Test-Path "vscode/cgmanifest.json")) {
            Write-Host "Creating cgmanifest.json"
            Set-Content -Path "vscode/cgmanifest.json" -Value '{"registrations":[],"version":1}' -Encoding UTF8
          }

      - name: Remove copilot extension
        shell: pwsh
        run: |
          if (Test-Path "vscode/extensions/copilot") {
            Remove-Item -Path "vscode/extensions/copilot" -Recurse -Force
            Write-Host "Removed copilot extension"
          }

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: vscode/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('vscode/package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Cache built-in extensions
        uses: actions/cache@v4
        with:
          path: vscode/.build/builtInExtensions
          key: builtin-exts-${{ hashFiles('vscode/product.json') }}
          restore-keys: |
            builtin-exts-

      - name: Install dependencies
        working-directory: vscode
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_foreground_scripts: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GYP_MSVS_VERSION: '2022'
          VSCODE_FORCE_INSTALL: '1'
        run: npm install --no-fund --no-audit 2>&1 || npm install --no-fund --no-audit 2>&1

      - name: Patch vsce npm.js for shell compatibility
        working-directory: vscode/build
        run: node patch-vsce.js

      - name: Build client
        working-directory: vscode
        run: npm run gulp "${{ matrix.gulp_target }}"
        env:
          VSCODE_ARCH: ${{ matrix.arch }}

      - name: Locate build output
        shell: pwsh
        run: |
          Write-Host "Searching for build output..."
          $parentDir = Split-Path $PWD.Path
          Get-ChildItem $parentDir -Depth 0 | Select-Object Name

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = Join-Path (Split-Path $PWD.Path) "VSCode-win32-${{ matrix.arch }}"
          if (Test-Path $buildDir) {
            Compress-Archive -Path $buildDir -DestinationPath "$PWD/IceCode-IDE-win-x64.zip"
            Write-Host "Packaged: $buildDir"
            Get-ChildItem $buildDir -Depth 0 | Select-Object Name
          } else {
            Write-Host "Build directory not found: $buildDir"
            $parentDir = Split-Path $PWD.Path
            Get-ChildItem $parentDir -Depth 0 | Select-Object Name
            Write-Error "Build output not found!"
          }

      - name: Create TAR (Linux)
        if: runner.os == 'Linux'
        run: |
          BUILD_DIR="../VSCode-linux-${{ matrix.arch }}"
          if [ -d "$BUILD_DIR" ]; then
            cd "$(dirname "$BUILD_DIR")"
            tar -czf "$GITHUB_WORKSPACE/IceCode-IDE-linux-x64.tar.gz" "$(basename "$BUILD_DIR")"
            echo "Packaged: $BUILD_DIR"
            ls -la "$BUILD_DIR" | head -20
          else
            echo "Build directory not found: $BUILD_DIR"
            ls -la .. | head -20
            exit 1
          fi

      - name: Create ZIP (macOS)
        if: runner.os == 'macOS'
        run: |
          BUILD_DIR="../VSCode-darwin-${{ matrix.arch }}"
          if [ -d "$BUILD_DIR" ]; then
            cd "$(dirname "$BUILD_DIR")"
            zip -r "$GITHUB_WORKSPACE/IceCode-IDE-mac-arm64.zip" "$(basename "$BUILD_DIR")"
            echo "Packaged: $BUILD_DIR"
            ls -la "$BUILD_DIR" | head -20
          else
            echo "Build directory not found: $BUILD_DIR"
            ls -la .. | head -20
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IceCode-IDE-${{ matrix.platform }}
          path: |
            IceCode-IDE-*.zip
            IceCode-IDE-*.tar.gz
          retention-days: 90
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true
          body: |
            ## IceCode IDE - VSCode Fork Release

            ### 下载与运行
            1. 下载对应平台的 ZIP/TAR
            2. 解压到任意目录
            3. 运行 `IceCode IDE` 可执行文件

            ### 功能特性
            - 基于 VSCode 1.121.0（完整编辑器能力）
            - IceCode AI 面板（左侧边栏，Trae 风格）
            - IceCode Dark 主题（紫蓝色 #8b5cf6）
            - 三模式切换（对话/构建/智能体）
            - 安全策略选择器（自动/手动/确认）
            - 22 个斜杠命令（14 Claude Code + 7 IceCode + /quit）
            - 全面中文界面
            - Diff 预览（Accept/Reject）
            - AI 工作阶段彩色标签
            - 状态栏 AI 指示器
            - Open VSX 扩展市场
            - Claude Code gRPC 后端集成
            - 多 LLM 支持（Claude/GPT/Gemini/DeepSeek/Ollama）
            - 内置 Git、终端、调试支持
            - 完整 VSCode 扩展兼容性
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
